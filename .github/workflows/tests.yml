name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:        # declenchement a la main, pour verifier

permissions:
  contents: read

jobs:
  tests:
    # Windows et non Linux : le releve tourne sous Windows (tache planifiee,
    # pythonw.exe) et plusieurs tests appellent tasklist ou pythonw.exe.
    # Sur ubuntu ils echoueraient ou seraient sautes sans rien prouver.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # meme version que la machine du releve

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        # Sans jeton ni base : les tests ne touchent ni le reseau ni
        # flight_deals.db (ignoree par git), tout est simule.
        run: python -m pytest tests -q

  postgres:
    # Linux et non Windows : les services de conteneurs n'existent pas sur
    # les runners Windows. Ce job ne lance QUE les tests de persistance ;
    # la suite complete reste sur Windows, ou vivent tasklist et pythonw.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: hub_deals_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests de persistance
        # Un saut ici viderait le job de son sens sans le faire rougir :
        # -rs les affiche, et l'etape echoue s'il y en a un seul.
        env:
          HUB_DEALS_EXIGE_PG: "1"
          HUB_DEALS_TEST_PG_URL: postgresql://postgres:essai@localhost:5432/hub_deals_test
        run: |
          set -o pipefail
          python -m pytest tests/test_magasin.py tests/test_migrer_abonnes.py -q -rs | tee sortie.txt
          if grep -q "skipped" sortie.txt; then
            echo "::error::des tests de persistance ont ete sautes"
            exit 1
          fi
